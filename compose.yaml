# Entorno LOCAL de desarrollo, no utilizar esta contraseña en un servidor público.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: patitas_local_dev
      POSTGRES_DB: refugio_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patitas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d refugio_db"]
      interval: 5s
      retries: 12
      timeout: 3s
volumes:
  patitas_pg_data:
